input.w{width:100%;margin-top:6px}input:focus{outline:none;border-color:var(--c)}input:disabled{opacity:.85}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:8px 16px}.opt.sel{border-color:var(--c);background:var(--c);color:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:26px;padding:10px 22px;background:var(--c);color:#fff;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}button:disabled{opacity:.45;cursor:default}
.chk{margin-top:8px;background:#ffb703;color:#27304a}
.fb{margin-top:8px;font-weight:700}.fb .fix{display:block;margin-top:4px;color:var(--ok)}
.fb .exp{display:block;direction:rtl;text-align:right;margin-top:6px;font-weight:600;background:rgba(255,183,3,.2);border-radius:10px;padding:6px 10px}
.nav{display:flex;justify-content:space-between;margin-top:14px}
#start{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#start div{max-width:420px;animation:in .6s}#start input{width:100%;font-size:1.2rem;text-align:center;margin:14px 0}

.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}.acts .g{background:#14a866}.acts .m{background:#ef4458}
.fl{position:fixed;top:-40px;font-size:1.8rem;animation:fall 3s linear forwards;pointer-events:none;z-index:5}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.sign{text-align:center;color:var(--mut);font-size:.85rem;margin-top:16px}
</style>

var S={},cur=0,name='';
function $(i){return document.getElementById(i)}
function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim()}
function words(s){return s.trim().split(/\s+/).filter(Boolean).length}
function fillText(q,vals){var i=0;return q.q.replace(/___/g,function(){return vals[i++]||'___'})}
function build(){
 var tb='',pn='';
 T.forEach(function(t,ti){
  tb+='<button id="tb'+ti+'" onclick="go('+ti+')" style="background:">'+t.id+'</button>';
  var h='<div class="pane" id="p'+ti+'" style="--c:'+t.c+'"><h2>Task '+t.id+' – '+t.t+'</h2><p class="ar">'+t.ar+'</p><p class="fr">'+t.fr+'</p><div class="tip">💡 '+t.tip+'</div>';
  t.q.forEach(function(q,qi){
   var id=ti+'_'+qi,body='';
   if(q.k=='fill'||q.k=='blank'){var n=0;body=q.q.replace(/___/g,function(){return '<input type="text" data-i="'+(n++)+'" autocomplete="off">'})}
   else if(q.k=='mc'){body=q.q.replace('___','_____')+'<div class="opts">'+q.o.map(function(o,oi){return '<button class="opt" data-o="'+oi+'" onclick="pick(\''+id+'\','+oi+')">'+String.fromCharCode(97+oi)+') '+o+'</button>'}).join('')+'</div>'}
   else{body=q.q+(q.h?'<div class="sub">'+q.h+'</div>':'')+'<input type="text" class="w" autocomplete="off">'}
   h+='<div class="qc" id="q'+id+'"><div class="qt"><span class="n">'+(qi+1)+'</span>'+body+'</div><button class="chk" onclick="chk('+ti+','+qi+')">Check ✔</button><div class="fb"></div></div>';
  });
  h+='<div class="nav"><button onclick="go('+(ti-1)+')" '+(ti?'':'disabled')+'>⬅ Back</button><button onclick="go('+(ti+1)+')">'+(ti==T.length-1?'Results 🏁':'Next ➡')+'</button></div></div>';
  pn+=h;
 });
 tb+='<button id="tb'+T.length+'" onclick="go('+T.length+')">🏁</button>';
 pn+='<div class="pane" id="p'+T.length+'" style="--c:#2f7bff"><h2 style="text-align:center">Your Results 🎉</h2><div class="big" id="sc"></div><div id="rows"></div><div class="acts"><button class="m" onclick="mail()">📧 Send to my teacher</button><button class="g" onclick="printAns()">🖨️ Print my answers</button></div><p class="sub" id="note" style="text-align:center;margin-top:10px"></p><div class="nav"><button onclick="go('+(T.length-1)+')">⬅ Back</button><span></span></div></div>';
 $('tabs').innerHTML=tb;$('panes').innerHTML=pn;
}
function pick(id,o){var qc=$('q'+id);if(qc.classList.contains('ok')||qc.classList.contains('bad'))return;qc.dataset.sel=o;qc.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('sel',b.dataset.o==o)})}
function chk(ti,qi){
 var id=ti+'_'+qi,qc=$('q'+id),q=T[ti].q[qi],fb=qc.querySelector('.fb');
 if(S[id])return;
 var ins=[].slice.call(qc.querySelectorAll('input')),v=ins.map(function(i){return i.value.trim()}),ok=false,ans='';
 if(q.k=='mc'){if(qc.dataset.sel===undefined){fb.textContent='👆 Tap an answer first.';return}
  var s=+qc.dataset.sel;ok=s==q.ok;ans=q.q.replace('___',q.o[s])}
 else{if(v.some(function(x){return !x})){fb.textContent='✍️ Write your answer first.';return}
  if(q.k=='fill'){ok=q.ok.indexOf(norm(v[0]))>-1;ans=fillText(q,v)}
  else if(q.k=='blank'){ok=true;ans=fillText(q,v)}
  else if(q.k=='sent'){ok=words(v[0])>=4&&q.re.test(v[0]);ans=v[0]}
  else{ok=words(v[0])>=q.min&&(!q.re||q.re.test(v[0]));ans=v[0]}}
 S[id]={ok:ok,a:ans};
 ins.forEach(function(i){i.disabled=true});qc.querySelectorAll('.opt').forEach(function(b){b.disabled=true});
 qc.querySelector('.chk').disabled=true;qc.classList.add(ok?'ok':'bad');
 fb.innerHTML=ok?'<span style="color:var(--ok)">✅ Correct! Well done! 🎉</span>':'<span style="color:var(--bad)">❌ Not correct.</span><span class="fix">✔ '+(q.k=='open'||q.k=='sent'?'Model answer: ':'Correct version: ')+q.m+'</span>'+(EXP[id]?'<span class="exp">💡 '+EXP[id]+'</span>':'');
 prog();save();
}
function prog(){
 var d=Object.keys(S).length,tot=0;T.forEach(function(t){tot+=t.q.length});
 $('pb').style.width=(d/tot*100)+'%';
 T.forEach(function(t,ti){var all=t.q.every(function(_,qi){return S[ti+'_'+qi]});$('tb'+ti).classList.toggle('done',all)});
}
function go(n){
 if(n<0)return;cur=n;save();
 for(var i=0;i<=T.length;i++){$('p'+i).classList.toggle('on',i==n);$('tb'+i).classList.toggle('on',i==n);var t=T[i];if(t)$('tb'+i).style.background=i==n?t.c:''}
 if(n==T.length)results();window.scrollTo(0,0);
}
function results(){
 var sc=0,tot=0,rows='';
 T.forEach(function(t,ti){var s=0;t.q.forEach(function(_,qi){tot++;if(S[ti+'_'+qi]&&S[ti+'_'+qi].ok){s++;sc++}});rows+='<div class="row"><span>Task '+t.id+' – '+t.t+'</span><b>'+s+' / '+t.q.length+'</b></div>'});
 $('sc').textContent=sc+' / '+tot+(sc==tot?' 🏆':sc>=tot*.7?' ⭐':' 💪');$('rows').innerHTML=rows;
 var left=tot-Object.keys(S).length;
 if(left){$('note').textContent='⚠️ '+left+' question(s) not answered yet — go back and check them.';}
 else if(sent){$('note').textContent='✅ All done! Your answers were sent to your teacher.';}
 else{$('note').textContent='All done! Sending your answers to your teacher…';}
 if(sc>=tot*.7)fall();
 if(left===0&&!sent)send();
}
function fall(){['🎉','⭐','🌟','🎊','✨'].forEach(function(e,i){for(var k=0;k<3;k++){var f=document.createElement('div');f.className='fl';f.textContent=e;f.style.left=(Math.random()*92)+'%';f.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(f);setTimeout(function(x){x.remove()},5000,f)}})}
function report(){
 var sc=0,tot=0,L=[];
 T.forEach(function(t,ti){L.push('');L.push('Task '+t.id+' – '+t.t);t.q.forEach(function(_,qi){tot++;var s=S[ti+'_'+qi];if(s&&s.ok)sc++;L.push(t.id+(qi+1)+'. '+(s?s.a+(s.ok?'  ✔':'  ✘'):'(no answer)'))})});
 return 'Session 8 · Practice Pack\nName: '+name+'\nScore: '+sc+' / '+tot+'\n'+L.join('\n');
}
function mail(){send()}
function send(){
 var r=report();
 $('note').textContent='📤 Sending your answers…';
 fetch(W3F_URL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:W3F_KEY,subject:'Session 8 Practice Pack – '+name,from_name:name,message:r})})
 .then(function(res){return res.json()})
 .then(function(d){if(d&&d.success){sent=true;save();$('note').textContent='✅ Your answers were sent to your teacher!';}else{$('note').textContent='⚠️ Sending failed — tap “📧 Send to my teacher” to retry, or use 📋.';}})
 .catch(function(){$('note').textContent='⚠️ No internet. Your answers are saved — tap “📧 Send to my teacher” again later.';});
}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify({name:name,cur:cur,S:S,sent:sent}))}catch(e){}}
function load(){try{var d=localStorage.getItem(LSKEY);if(d){var o=JSON.parse(d);if(o&&o.S)return o}}catch(e){}return null}
function printAns(){
 var r=report();
